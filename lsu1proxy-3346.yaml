########################################################################
# Batch
# atkerul MAJD a proxyba , de ettol meg arre a szkciora szugseg lesz 
batch:
  granularity: 5
  enabled: False
  processes:
    - orderStatus:
        startDelay: 10                     # initial delay after start BatchScheduler
        frequency: 30                      # Batch thread raise/trigger interval
        name: Rendeles Statusz - UNAS      # Batch threadName
        method: orderStatusUnasProxy       # called Entry point
        orderStatusCheckInterval: 600      # RovModified > NOW -orderStatusCheckInterval(seconds)
        setStatusSafetyInterval: 0       # Ha ez >0 akkor a RovModified > context.lastSetOrderstatus - setStatuSafetyInterval a viszonyitasi alap!!

        checkVoucherSequence: 42           # UNAS order type identifier
        defaultClosedStatus: "Megrendelés lezárva" # IF  closed, manuallyClosed, canceled is 1 and can nto find in statuses? elvileg nem lehet
        statuses:
          - [ closed, "Megrendelés lezárva"]            # CustmerOrder.Closed = 1
          - [ manuallyClosed, "Megrendelés törölve"]    # CustmerOrder.ClosedManually = 1
          - [ canceled, "Megrendelés lezárva"]          # CustmerOrder.Cancelled = 1
          - [ 1, "Feldolgozásra vár"]                   #   == 1, 2, 3 ...
          - [ 2, "Visszaigazolva"]                      # 
          - [ 3, "Készletezés alatt"]                   #
          
    - saveProxyContent:
        enabled: False
        startDelay: 105
        frequency:  3601
        name: Unas Context Saver
        method: saveUnasProxyContext

    - refreshCache:
        enabled: False
        startDelay: 1000
        frequency:  3603
        name: Unas-Cache-Referesher
        method: refreshUnasCache

    - masterChallenge:
        enabled: False
        startDelay: 600
        frequency:  1800
        name: Active machine promoter
        method: masterChallengeUnas

    - logrotate:
        enabled: True
        startDelay: 36000
        frequency:  864000
        name: ZIP Logrotated files
        method: batchMethodWrapper
        logPath: logz
        archivePath: logz-z
        preserveDays: 105

