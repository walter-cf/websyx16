logLevel: Trace
proxy:
  # a kulso interface-re jobb tenni. nem szereti a 0.0.0.0 -s cimet - igy viszont nem hallgat a localhoston!
  hostName: syxproxy.lan
  serverPort: 3301

mail:
  server: 192.168.10.6
  sender: web6proxy-alert@ledsound.hu
  operator: web6proxy-operator@ledsound.hu
#
# Control socket elavult , ki kellene szednem
controlSocket:
  enabled: False
  host: 0.0.0.0
  port: 3305
#
# Control WebServer
controlWeb:
  enabled: True
  host: syxproxy.lan 
  port: 3307

unas:
  # Lehet .hu es .eu is
  apiUrl: https://api.unas.eu/shop
  feedbackUrl: "'http://' + hostName + ':' + str(serverPort) + '/fbunas'"
  # a WewbShopban kell generalni a hozzaferesi kulcsot
  apiKey: fa77a4c391b513ead26efce83180576f89fa79cb
  # A symbolbol unasba feltoltendo termekek UNAS.kategoria.Id-je. (gondolom, ezt kesobb meg egyeztetni kell)
  webcategory:
    # id: 880790
    name: Webáruházba
  # technikai, nekem kellett, Amikor mexaladt a prg es kitiltottam magamat, akkor default ertekeket adtam vissza magamnak az UNAS hivasokkor(HA ez TRUE)
  ignoreBlockedClient: false # szerinem elavult, ki kellenne szednem
  cacheForceReload: 10000 # force cahce reload after this period
  #
  # Comm stat:
  commstat:
    maxerrorcnt: 3 # continous tries
    maxloginerr: 3 # Not Used Yet - a Login es a POST - kulon kezelem , hatha kulon kell nezni az errorCnt is - de MOST NU.!
    blockedTimeMax: 600 # after 10 minutes will retry again - error counters will reset + SendMail -again
    alertRetryAfter: 600 # Resend Alert mail by [alertRetryAfter] seconds
    sendPacketWarningThreshold: 5000 # hourly max packet MySQL-ben tartom, es onnan is kerdez le
    sendPacketStopLimit:  5500 # hourly max packet MySQL-ben tartom, es onnan is kerdez le
    #
    # Mar elavultak az alabbiak, ki kellene szedenem
    preserveIdleMaster: 600 # degrade master after inactive `preserveIdleMaster` seconds
    enableMasterChallenger: False # TRUE -> Ha automatizalt lesz az Symbol-Unas utemezes, es csak EGY gepnek akarom engedni(IP cim alapjan)
    preserveIdleMaster: 600 #  Ennyi IDLE utan Master status torlodeik es a kovetkezo(vagy utoljara) aktiv lesz a master

    clientChallenge:
      idleTime: 600  # after this (seconds) client marked as offline
      machines: [ 192.168.10.6, 192.168.10.2, 192.168.10.4, 192.168.10.11 ] # Az elorebb levonek magasabb a prioritasa!
      method: Prio # { None | Last | Prio | API }
                  # None: Current active transaction
                  # Last (Last active client)
                  # Prio: Prefer priorityList but only client has activity in `idleTime`
                  # API : Manually set by operator vi ProxyControl interface
  #
  #
  customerPaymentMode: "Szerződés szerint"
  priceRules:
    transportModes:
      - ["Helyszíni"        ,"Személyes átvétel a bemutatótermünkben"]
      - ["MPL Futár"        ,"MPL futárral"]
      - ["Gyűjtőzendő"      ,"Ne küldjétek még! Várjon még másik megrendelésre!"]
    paymentMethods: [
        [ "Utánvét"         , "Utánvéttel"      ],
        [ "Bankkártya"      , "Bankkártyával a helyszínen"   ],
        [ "Előre utalás"    , "Előre utalással" ],
        [ specialFunction01 , "Szerződött fizetési mód" ]   ## Ide tettem, hogy helyen legyen a program kezelem `specialFuncion01` kifejezest, ha azt kapom
      ]

  order:
    # Unas paarmeterk: symbolId
    # Unit => seconds
    # getInterval: 1180 NOT USED most mar status szerint szed le 
    vouchersequencecode: "B2B"
    symbolOrderPrefix: H24
    symbolOrderStatusNew: 1
    sendOrderStatusEmail: No   # Yes - send alert-mail if customerOrder status changed

    # Order params - statuses
    status:
        new:      805088 # Feldolgozasra var
        accepted: 805092 # Visszaigazolva
        prepared: 805096 # Keszletezes alatt
        shipping: 0       # NU.? 
        closed:   805104 # Lezarva
        returned: 0       # NU. in UNAS (yet)
        cancel:   0       # NU. in UNAS (yet)
    autoAcknowledge: False
    flow:
      getUnregistered: False
      getMissingCust: False

  customer:
    # Unas paarmeterek: symbolId, symbolCode
    categoryName: HU / Channel / Haffner24 UNAS
    getInterval: 600 
    bulk: False
    ignoreCyclicInterval: 1
    cerateMissingCustomer: False
    forceNewState: True
    handleCustomerAddress: False
    bulkFeedback: False

    countries:
      at:  'Ausztria'
      uk:  'Egyesült Királyság'
      gr:  'Görögország'
      hu:  'Magyarország'
      de:  'Németország'
      pt:  'Portugália'
      ro:  'Románia'
      se:  'Svédország'
    codePrefix:
      default: UCO
      unregistered: UCU
      address: UCA # plus sorszam 1-99
      pattern: '%s-%i'
      patternAddr: '%s-%i-%i'

  inventory:
    warehouses: [ -1, 999999, 999998 ]

  product:
    # Unas paarmeterk: symbolId, symbolCode??, EAN, Gyarto, VTSZ
    getInterval: 600
    getproductLimit: 200 # a 6000 tetel lekerdezese egyszerre sok lett, dartabolni kell
    bulk: False
    overwriteName: False
    pricecat:
      # Symbol arkategoria ID. Ha tobb van, akkor ezeket - sorrendben - elonyben reszesiti; egyebkent a listaban az utolso ar lesz(vagy lehet, az elso)
      base: 18
      fallback1: -9999999
      fallback2: -9999999

